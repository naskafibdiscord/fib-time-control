<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F.I.B — Time Control</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 90%;
    max-width: 450px;
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;
    border: 2px solid #2d7cff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 25px;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(45,124,255,0.25);
}

h1 {
    font-size: 32px;
    letter-spacing: 4px;
}

.subtitle {
    color: #777;
    margin-top: 8px;
    margin-bottom: 35px;
}

.card {
    background: #111;
    border: 1px solid #222;
    border-radius: 18px;
    padding: 30px 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.card h2 {
    margin-bottom: 12px;
}

.card p {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}

.discord {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #5865F2;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.discord:active {
    transform: scale(0.98);
}

.footer {
    margin-top: 25px;
    color: #444;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        F.I.B
    </div>

    <h1>TIME CONTROL</h1>

    <div class="subtitle">
        Gestion des services F.I.B
    </div>

    <div class="card">

        <h2>Bienvenue</h2>

        <p>
            Connectez votre compte Discord
            pour accéder à votre espace agent.
        </p>

        <button class="discord" onclick="connexion()">
            🔵 Se connecter avec Discord
        </button>

    </div>

    <div class="footer">
        F.I.B — Système de gestion des services
    </div>

</div>

<script>
function connexion() {
    alert("La connexion Discord sera configurée dans la prochaine étape.");
}
</script>

</body>
</html>
